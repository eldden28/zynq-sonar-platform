# Production UltraZed-EG 3EG SOM on the Avnet AES-ZU-IOCC-G carrier.
require conf/machine/zynqmp-ultrazed-3eg-iocc-sdt-full.conf
MACHINEOVERRIDES:append = ":ultrazed-3eg-iocc"
hostname:pn-base-files = "ultrazed-3eg-iocc"

SERIAL_CONSOLES = "115200;ttyPS0"
KERNEL_COMMAND_APPEND = "console=ttyPS0,115200 earlycon net.ifnames=0"
UBOOT_BOOT_SCRIPT:ultrazed-3eg-iocc = "u-boot-xlnx-scr"
BOOTMODE = "ultrazed-iocc"
WKS_FILES = "sonar-sd.wks"
IMAGE_FSTYPES = "tar.gz ext4 wic wic.gz wic.bmap"
IMAGE_BOOT_FILES = "boot.bin;BOOT.BIN boot.scr Image system.dtb"
WKS_FILE_DEPENDS:append = " virtual/boot-bin"

EXTRA_DT_INCLUDE_FILES:append = " ultrazed-iocc-board.dtsi"
FILESEXTRAPATHS:prepend:pn-device-tree := "${SONAR_EDF_LAYERDIR}/recipes-bsp/device-tree/files:"
