# Generated by gen-machineconf parse-sdt, never copied from PetaLinux outputs.
require conf/machine/zynq-cora-z7-10-sdt-full.conf
MACHINEOVERRIDES:append = ":cora-z7-10"

SERIAL_CONSOLES = "115200;ttyPS0"
KERNEL_COMMAND_APPEND = "console=ttyPS0,115200 earlycon"
UBOOT_BOOT_SCRIPT:cora-z7-10 = "u-boot-xlnx-scr"
BOOTMODE = "generic.root"
WKS_FILES = "sonar-sd.wks"
IMAGE_FSTYPES = "tar.gz ext4 wic wic.gz wic.bmap"
IMAGE_BOOT_FILES = "boot.bin;BOOT.BIN boot.scr uImage system.dtb"
# The vendor auto-dependency checks the installed name 'boot.bin'; our FAT
# filename is BOOT.BIN, so declare this deployment dependency explicitly.
WKS_FILE_DEPENDS:append = " virtual/boot-bin"

EXTRA_DT_INCLUDE_FILES:append = " cora-board.dtsi"
FILESEXTRAPATHS:prepend:pn-device-tree := "${SONAR_EDF_LAYERDIR}/recipes-bsp/device-tree/files:"

# 25.05 EDF bootbin version headers are implemented for newer SoCs only.
BOOTBIN_DEPENDS:remove = "bootbin-version-header:do_deploy"
BIF_OPTIONAL_DATA = ""
BIF_OPTIONAL_DATA:remove = "${DEPLOY_DIR_IMAGE}/bootbin-version-header-${MACHINE}.bin, id=0x22;"
