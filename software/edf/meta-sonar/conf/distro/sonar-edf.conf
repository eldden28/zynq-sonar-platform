require conf/distro/amd-edf.conf

DISTRO = "sonar-edf"
DISTRO_NAME = "Sonar platform on AMD EDF"
DISTROOVERRIDES = "poky:poky-altcfg:amd-edf:sonar-edf"

# Preserve the current SysV services during the initial OS migration.
POKY_INIT_MANAGER:sonar-edf = "sysvinit"
DISTRO_FEATURES:remove = "systemd virtualization xen openamp multiarch security tpm vmsep x11 wayland opengl vulkan"
ENABLE_XEN_DTSI = "0"
ENABLE_XEN_QEMU_DTSI = "0"
ENABLE_OPENAMP_DTSI = "0"
