BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "sonar-edf"
BBFILE_PATTERN_sonar-edf = "^${LAYERDIR}/"
BBFILE_PRIORITY_sonar-edf = "8"
LAYERDEPENDS_sonar-edf = "core amd-edf platform-common"
LAYERSERIES_COMPAT_sonar-edf = "scarthgap"

# Stable maintained board inputs; hardware-generated files live in build/conf.
SONAR_EDF_LAYERDIR := "${LAYERDIR}"
