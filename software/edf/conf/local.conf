CONF_VERSION = "2"
DISTRO = "sonar-edf"
SONAR_EDF_RELEASE = "25.05"
PACKAGE_CLASSES = "package_rpm"
require conf/@EDF_HARDWARE_CONF@

# Conservative defaults for the 8 GiB host. Caches persist across build dirs.
BB_NUMBER_THREADS = "2"
BB_NUMBER_PARSE_THREADS = "3"
PARALLEL_MAKE = "-j2"
# This sonar profile has no ROS runtime. Keep the pinned layers available for
# EDF layer dependencies, but avoid parsing their unrelated application set.
BBMASK += "/meta-ros/"
BB_SERVER_TIMEOUT = "60"
# Use task hashes directly with the published, hash-addressed sstate mirrors.
BB_HASHSERVE = ""
BB_SIGNATURE_HANDLER = "OEBasicHash"
DL_DIR = "@EDF_WORKSPACE@/downloads"
SSTATE_DIR = "@EDF_WORKSPACE@/sstate-cache"
BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},10G,100K STOPTASKS,${DL_DIR},10G,100K HALT,${TMPDIR},2G,10K"

INHERIT += "own-mirrors"
INHERIT += "sonar-sstate"
SOURCE_MIRROR_URL = "https://petalinux.xilinx.com/sswreleases/amd-edf/${SONAR_EDF_RELEASE}/downloads"
# Fetch only matching hash-addressed artifacts, never the bulk offline bundles.
SSTATE_MIRRORS = "file://.* https://petalinux.xilinx.com/sswreleases/amd-edf/${SONAR_EDF_RELEASE}/aarch64/sstate-cache/PATH;downloadfilename=PATH"
# Matching 2025.1 ARM artifacts can also satisfy unchanged low-level recipes.
SSTATE_MIRRORS:append = " \n file://.* https://petalinux.xilinx.com/sswreleases/rel-v2025.1/arm/sstate-cache/PATH;downloadfilename=PATH"
include conf/host-cache.conf

INHERIT += "rm_work"
# The machine generator uses the native configuration tools' recipe sysroots.
RM_WORK_EXCLUDE += "esw-conf-native lopper-native xilinx-lops-native"

SKIP_META_XILINX_STANDALONE_SANITY_CHECK = "1"
SKIP_META_XILINX_STANDALONE_SDT_SANITY_CHECK = "1"
SKIP_META_VIRT_SANITY_CHECK = "1"
SKIP_META_SECURITY_SANITY_CHECK = "1"
SKIP_META_TPM_SANITY_CHECK = "1"
SKIP_META_XILINX_MALI400_SANITY_CHECK = "1"
SKIP_META_XILINX_MALIG78AE_SANITY_CHECK = "1"
