CONF_VERSION = "2"
DISTRO = "sonar-edf"
PACKAGE_CLASSES = "package_rpm"
require conf/cora-hardware.conf

# Conservative defaults for the 8 GiB host. Caches persist across build dirs.
BB_NUMBER_THREADS = "2"
BB_NUMBER_PARSE_THREADS = "2"
PARALLEL_MAKE = "-j2"
BB_SERVER_TIMEOUT = "60"
DL_DIR = "@EDF_WORKSPACE@/downloads"
SSTATE_DIR = "@EDF_WORKSPACE@/sstate-cache"
BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},10G,100K STOPTASKS,${DL_DIR},10G,100K HALT,${TMPDIR},2G,10K"

INHERIT += "own-mirrors"
SOURCE_MIRROR_URL = "https://petalinux.xilinx.com/sswreleases/amd-edf/${AMD-EDF_VERSION}/downloads"
# No bulk offline/sstate bundles: the release bundles exceed this host's space.

SKIP_META_XILINX_STANDALONE_SANITY_CHECK = "1"
SKIP_META_XILINX_STANDALONE_SDT_SANITY_CHECK = "1"
SKIP_META_VIRT_SANITY_CHECK = "1"
SKIP_META_SECURITY_SANITY_CHECK = "1"
SKIP_META_TPM_SANITY_CHECK = "1"
SKIP_META_XILINX_MALI400_SANITY_CHECK = "1"
SKIP_META_XILINX_MALIG78AE_SANITY_CHECK = "1"
