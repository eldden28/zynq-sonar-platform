BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "platform-common"
BBFILE_PATTERN_platform-common = "^${LAYERDIR}/"
BBFILE_PRIORITY_platform-common = "6"
LAYERSERIES_COMPAT_platform-common = "scarthgap"

# Application and reusable driver sources live outside every PetaLinux
# project so all CPU architectures build the same revision.
PLATFORM_COMMON_SOURCE_ROOT := "${LAYERDIR}/../.."
